<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المرشد الواقعي v7 | Surfcasting Tunisia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --card-border: #30363d;
            --text: #e6edf3; --text-secondary: #8b949e;
            --accent: #58a6ff; --highlight: #e94560;
            --excellent: #3fb950; --possible: #58a6ff;
            --difficult: #d29922; --impossible: #f85149;
            --font: 'Tajawal', sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: var(--font); background: var(--bg); color: var(--text); padding: 12px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card h2 { margin-bottom: 12px; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--highlight); color: white; font-family: var(--font); font-size: 1.2rem; font-weight: 700; cursor: pointer; }
        #loader { display: none; text-align: center; padding: 30px; font-size: 1.2rem; color: var(--accent); }
        
        /* Decision Maker Results */
        #decision-results .spot-card {
            background: var(--bg); border: 1px solid var(--card-border); border-radius: 8px;
            padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .spot-info h4 { font-size: 1.1rem; margin: 0; }
        .spot-info p { font-size: 0.9rem; color: var(--text-secondary); margin: 4px 0; }
        .spot-verdict { font-size: 1.2rem; font-weight: 700; padding: 6px 12px; border-radius: 6px; }
        .debris-warning { color: var(--difficult); font-size: 0.8rem; font-weight: 700; }
        .fish-predictions { display: flex; gap: 6px; margin-top: 8px; }
        .fish-tag { background-color: var(--accent); color: var(--bg); font-size: 0.8rem; padding: 2px 8px; border-radius: 12px; font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <header style="text-align:center; padding: 20px 0;">
        <h1>🎯 المرشد الواقعي v7</h1>
        <p>يحلل جميع الأماكن مع الأخذ في الاعتبار الموسم ودرجة حرارة الماء</p>
    </header>

    <div class="card">
        <button id="decision-btn">🔍 ابحث عن أفضل فرصة لليوم</button>
    </div>

    <div id="loader">⏳ جاري تحليل جميع الأماكن... هذه العملية قد تستغرق دقيقة...</div>

    <div id="decision-results" style="display:none;">
        <div class="card">
            <h2>خلاصة اليوم</h2>
            <div id="spot-list"></div>
        </div>
    </div>
</div>

<script>
const API = "http://127.0.0.1:8000";
const V_COLORS = {'ممتاز':'var(--excellent)','ممكن':'var(--possible)','صعب':'var(--difficult)','مستحيل':'var(--impossible)'};

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('decision-btn').addEventListener('click', getDecision);
});

async function getDecision() {
    const loader = document.getElementById('loader');
    const resultsDiv = document.getElementById('decision-results');
    const spotList = document.getElementById('spot-list');

    loader.style.display = 'block';
    resultsDiv.style.display = 'none';
    spotList.innerHTML = '';

    try {
        const response = await fetch(`${API}/decision-maker`);
        if (!response.ok) throw new Error('فشل في الاتصال بالخادم');
        const data = await response.json();
        
        if (data.length === 0) {
            spotList.innerHTML = '<p>لم يتم العثور على فرص جيدة اليوم.</p>';
        } else {
            data.forEach(spot => {
                const card = document.createElement('div');
                card.className = 'spot-card';
                
                let debrisWarning = spot.persistent_debris ? '<p class="debris-warning">⚠️ تحذير: مخلفات عاصفة الأمس</p>' : '';
                
                let fishTags = '';
                if (spot.likely_fish && spot.likely_fish.length > 0) {
                    fishTags = '<div class="fish-predictions">' + spot.likely_fish.map(fish => `<span class="fish-tag">${fish}</span>`).join('') + '</div>';
                }

                card.innerHTML = `
                    <div class="spot-info">
                        <h4>${spot.spot_name}</h4>
                        <p>أفضل فرصة: ${spot.best_period}</p>
                        ${debrisWarning}
                        ${fishTags}
                    </div>
                    <div class="spot-verdict" style="background-color:${V_COLORS[spot.verdict]}; color: #0d1117;">
                        ${spot.verdict}
                    </div>
                `;
                spotList.appendChild(card);
            });
        }

        resultsDiv.style.display = 'block';
        resultsDiv.scrollIntoView({ behavior: 'smooth' });

    } catch (error) {
        alert('حدث خطأ: ' + error.message);
    } finally {
        loader.style.display = 'none';
    }
}
</script>
</body>
</html>
